[project]
name = "basic-backpropagation"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jaxtyping>=0.3.7",
    "numpy>=2.2.6",
    "torch>=2.12.0",
    "typing-extensions>=4.15.0",
]

[tool.uv]
package = true

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pyrefly>=1.0.0",
]

[tool.pyrefly]
project-includes = ["src/**/*.py"]
project-excludes = [
    ".venv/**",
    "neural-networks-and-deep-learning/**",
]
python-version = "3.10"
tensor-shapes = true
